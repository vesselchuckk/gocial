apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
   name: gosocial-backend
   namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/vesselchuckk/gocial.git
    targetRevision: master
    path: charts/gosocial
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
