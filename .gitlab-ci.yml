stages:
  - lint
  - test
  - build


variables:
  # go
  GO_VERSION: "1.25.1"
  GOPATH: "${CI_PROJECT_DIR}/.cache/go-path"
  GOMODCACHE: "${CI_PROJECT_DIR}/.cache/go-mod"
  GOCACHE: "${CI_PROJECT_DIR}/.cache/go-build"
  # docker
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

default:
  image: golang:${GO_VERSION}-alpine
  cache:
    key:
      files:
        - go.sum
    paths:
      - ${GOPATH}
      - ${GOCACHE}

# LINT

lint:
  stage: lint
  before_script:
    - apk add --no-cache git
    - go install honnef.co/go/tools/cmd/staticcheck@latest
  script:
    - go mod tidy
    - go mod verify
    - go vet ./...
    - staticcheck ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# TEST

test:
  stage: test
  services:
    - name: redis:6.2-alpine
      alias: redis
    - name: postgres:16-alpine
      alias: db
  variables:
    POSTGRES_NAME: gosocial-test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DB_URL: "postgres://test:test@db:5432/gosocial-test?sslmode=disable"
  before_script:
    - apk add --no-cache git build-base
  script:
    - go build -v ./...
    - go test -race -vet=off -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.out
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# BUILD

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    IMAGE_TAG: "go-social:${CI_COMMIT_SHORT_SHA}"
  script:
    - docker build -f docker/Dockerfile -t "${IMAGE_TAG}" .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
